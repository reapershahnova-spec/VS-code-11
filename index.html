<!DOCTYPE html>
<html>
  <head>
    <title>Multiplication with Undefined Parameter</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1 class="title">JavaScript Function Activity</h1>
    
    <button onclick="myfunction(4, 4)">Click Me (4 * 4)</button>
    <button onclick="myfunction(5)">Click Me (5 * default 2)</button>
    
    <p id="result1"></p>
    <p id="value1"></p>
    <p id="value2"></p>

    <script src="script.js"></script>
  </body>
</html>
